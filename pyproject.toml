[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guess-price-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.20,<4",
    "alembic>=1.15,<2",
    "asyncpg>=0.30,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=25.1,<26",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=1.2,<2",
    "respx>=0.22,<1",
    "ruff>=0.11,<1",
]

[project.scripts]
guess-price-bot = "guess_price_bot.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/guess_price_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
